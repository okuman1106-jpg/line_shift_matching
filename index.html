<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>シフト希望を送る</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif;
      padding: 20px 16px 40px;
      max-width: 480px;
      margin: 0 auto;
      color: #222;
    }
    h2 { font-size: 18px; margin-bottom: 4px; }
    p.lead { font-size: 13px; color: #666; margin-top: 0; }
    label {
      display: block;
      margin-top: 16px;
      font-size: 13px;
      color: #444;
      font-weight: bold;
    }
    select, input[type="date"], input[type="time"] {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
    }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    button {
      width: 100%;
      margin-top: 26px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      background: #06C755;
      color: white;
      border: none;
      border-radius: 10px;
    }
    button:disabled { background: #ccc; }
    #status {
      margin-top: 14px;
      font-size: 13px;
      color: #c0392b;
      min-height: 18px;
    }
    #status.ok { color: #0a7a3d; }
  </style>
</head>
<body>
  <h2>シフト希望を送る</h2>
  <p class="lead">日付・時間・現場を選んで送信すると、そのまま希望として登録されます。</p>

  <label for="date">希望日</label>
  <input type="date" id="date">

  <div class="row">
    <div>
      <label for="start">開始時刻</label>
      <input type="time" id="start" value="09:00">
    </div>
    <div>
      <label for="end">終了時刻</label>
      <input type="time" id="end" value="18:00">
    </div>
  </div>

  <label for="site">第1希望の現場</label>
  <select id="site">
    <option>読み込み中…</option>
  </select>

  <div id="status"></div>
  <button id="submitBtn" disabled>この内容で希望を送る</button>

  <script>
    // GitHub Pagesなど、ふつうの静的ホスティングでそのまま動くように、
    // Apps Scriptのテンプレート機能は使わず、直接値を書き込む形にしている。
    var LIFF_ID = "2011471755-3Cq58cjB";
    var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzVEXJypzsZSyBZebaD6U3XAuJBlr52nA6aelV9SWSED85VJlg6UZ7Hw8ocABeGdg/exec";

    var statusEl = document.getElementById('status');
    var submitBtn = document.getElementById('submitBtn');

    function setStatus(msg, ok) {
      statusEl.textContent = msg || "";
      statusEl.className = ok ? "ok" : "";
    }

    function pad2(n) { return (n < 10 ? "0" : "") + n; }

    function setDefaultDate() {
      var d = new Date();
      d.setDate(d.getDate() + 1); // 既定値は「明日」
      var val = d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
      document.getElementById('date').value = val;
    }

    function loadSites() {
      return fetch(SCRIPT_URL + "?action=sites")
        .then(function (res) { return res.json(); })
        .then(function (data) {
          var sel = document.getElementById('site');
          sel.innerHTML = "";
          (data.sites || []).forEach(function (name) {
            var opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            sel.appendChild(opt);
          });
          if (!data.sites || data.sites.length === 0) {
            setStatus("現場マスタに現場が登録されていません。管理者に連絡してください。");
          }
        })
        .catch(function () {
          setStatus("現場一覧の取得に失敗しました。時間をおいて開き直してください。");
        });
    }

    function main() {
      setDefaultDate();
      loadSites().then(function () {
        if (typeof liff === "undefined") {
          setStatus("LIFFの読み込みに失敗しました。LINEアプリ内で開き直してください。");
          return;
        }
        liff
          .init({ liffId: LIFF_ID })
          .then(function () {
            submitBtn.disabled = false;
          })
          .catch(function (err) {
            setStatus("LIFFの初期化に失敗しました：" + err);
          });
      });
    }

    submitBtn.addEventListener('click', function () {
      var date = document.getElementById('date').value;
      var start = document.getElementById('start').value;
      var end = document.getElementById('end').value;
      var site = document.getElementById('site').value;

      if (!date || !start || !end || !site) {
        setStatus("すべての項目を入力してください。");
        return;
      }

      var text = "希望 " + date + " " + start + "-" + end + " " + site;

      if (!liff.isInClient()) {
        setStatus("この画面はLINEアプリ内で開いてください。");
        return;
      }

      submitBtn.disabled = true;
      setStatus("送信しています…");

      liff
        .sendMessages([{ type: "text", text: text }])
        .then(function () {
          setStatus("送信しました。この画面を閉じます。", true);
          setTimeout(function () { liff.closeWindow(); }, 900);
        })
        .catch(function (err) {
          submitBtn.disabled = false;
          setStatus("送信に失敗しました：" + err);
        });
    });

    main();
  </script>
</body>
</html>
